name: Naber build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  plugin-tests:
    name: WordPress eklentisi testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Sozdizimi kontrolu (php -l)
        run: find wordpress-plugin -name "*.php" -print0 | xargs -0 -n1 php -l

      # Yeni test dosyasi eklendiginde is akisini guncellemeye gerek kalmasin.
      - name: Eklenti testleri
        run: |
          set -e
          for t in wordpress-plugin/naber-chat/tests/test-*.php; do
            echo "::group::$t"
            php "$t"
            echo "::endgroup::"
          done

      # Sunucuya yuklenecek hazir paket; WordPress eklenti yukleme
      # ekranindan dogrudan kurulabilir.
      - name: Eklenti zip'i olustur
        run: |
          cd wordpress-plugin
          zip -r ../naber-chat.zip naber-chat -x "*/tests/*"

      - name: Eklenti zip'ini yukle
        uses: actions/upload-artifact@v4
        with:
          name: naber-chat-plugin
          path: naber-chat.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest imajinda Android SDK zaten kurulu geliyor.
      - name: SDK yolunu bildir
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Debug APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain --stacktrace

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: naber-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
